name: CPU Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          # Test with numpy/scipy versions
          - os: ubuntu-latest
            python-version: '3.11'
            numpy-version: '1.24'
          - os: ubuntu-latest
            python-version: '3.11'
            numpy-version: '1.26'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1 \
            tesseract-ocr \
            libtesseract-dev \
            poppler-utils

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract opencv

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --version=5.3.0.20230401 -y
          # Note: OpenCV and other deps installed via pip

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,test]"
          # Install specific numpy version if specified
          if [ -n "${{ matrix.numpy-version }}" ]; then
            pip install "numpy==${{ matrix.numpy-version }}.*"
          fi

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short -m "not slow and not gpu and not benchmark" --junitxml=test-results/unit-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Run integration tests
        run: |
          python -m pytest tests/ -v --tb=short -m "integration" --junitxml=test-results/integration-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Run coverage
        run: |
          python -m pytest tests/ --cov=core --cov=learning --cov=perception --cov=adapters --cov=simulated_game --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install ruff mypy

      - name: Run ruff (linting)
        run: |
          ruff check core/ learning/ perception/ adapters/ simulated_game/ tests/
          ruff format --check core/ learning/ perception/ adapters/ simulated_game/ tests/

      - name: Run mypy (type checking)
        run: |
          mypy core/ learning/ perception/ adapters/ simulated_game/ --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run bandit
        run: |
          pip install bandit
          bandit -r core/ learning/ perception/ adapters/ simulated_game/ -f json -o bandit-report.json || true

      - name: Run safety
        run: |
          pip install safety
          safety check --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 7

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[docs]"

      - name: Build docs
        run: |
          cd docs && make html || echo "Docs not configured, skipping"

  notify:
    name: Notify on Failure
    needs: [test, lint, security]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "CI failed! Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here